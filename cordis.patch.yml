# dsh-aidlc bundle patch — layered on top of the profile's other bundle layers.
#
# Two rows:
#
#   1. `aidlc` — the AIDLC host plugin. Owns the guards, gates, decision layer,
#      commands, tools, AND the two skills.
#
#      Why the skills are not a `dsh-skill-filesystem` row with
#      `customSkillDirs`: those entries are `path.resolve`-ed against the DSH
#      process CWD, not against this package, so a relative path here would
#      silently resolve somewhere unrelated to the plugin (and a patch override
#      replaces a row's whole `config` rather than merging into it).
#      `lib/skills.js` instead registers a provider on `ctx.skills` anchored
#      with `new URL('../skills/', import.meta.url)`, which is CWD-independent
#      and needs no user configuration.
#
#   2. `aidlc-reviewer` — a SECOND delegation tool, `subagent_reviewer`, whose
#      children cannot write.
#
#      The ported AI-DLC protocol has four read-only reviewer roles
#      (reviewer-pm / reviewer-architect / reviewer-qa / reviewer-dev). In the
#      ZCode original they were read-only *mechanically*: those subagents simply
#      had no Edit/Write tool. DSH subagents inherit their parent's composition
#      and cannot be given a different preset (the child-composition funnel
#      takes the parent context as its only source), so a naive port would
#      downgrade that guarantee to prompt text.
#
#      It does not have to be downgraded. A subagent start request carries a
#      `toolFilter`, which in-process providers apply as a scoped
#      `tools.restrict()` in the child's creation window — the named tools
#      *vanish from the child's prompt AND refuse to execute*, enforced by the
#      tool registry rather than by instructions. The filter is persisted in the
#      durable subagent descriptor, so the guarantee survives a cold resume.
#
#      `allow` is used rather than `deny` on purpose: a deny-list is fail-open,
#      so any write-capable tool added later would leak into reviewers, while an
#      allow-list is fail-closed. The names below were verified against the
#      shipped tool packages (read/read_image from dsh-tool-fs; glob/grep from
#      dsh-tool-fs-search; skill from dsh-tool-skill; todo_write from
#      dsh-tool-todo). Deliberately absent: write, edit, pwsh, bash (write
#      paths), and subagent/subagent_fork/workflow (so a reviewer cannot
#      delegate around its own restriction).
#
#      LIMIT, stated honestly: this is tool-read-only, not capability-isolated.
#      A reviewer still shares the parent's model route, session store and
#      sandbox. And because `tools.restrict()` rejects an unknown name, a
#      deployment that lacks one of the listed tools will refuse to spawn a
#      reviewer with an error naming the valid set — adjust the list below. That
#      failure is loud and safe; the alternative (a deny-list) would fail
#      silently and unsafely.

- insert:
    - id: aidlc
      name: dsh-aidlc

    # ── reviewer delegation ──────────────────────────────────────────────────
    # v0.2.1 REMOVED `persona` and `toolFilter` from `dsh-tool-subagent`, and it
    # THROWS at apply time when either is present:
    #   'tool-subagent: <field> is no longer supported; configure persona and
    #    tool plugins in an Agent Preset and select it with agentPreset'
    #   (dsh-tool-subagent/lib/index.js:355)
    # Both fields used to carry the mechanical read-only guarantee for the four
    # reviewer roles. Leaving them in would have made this row fail to mount
    # while `npm run check` still passed — it greps this file instead of mounting
    # it, which is precisely how the breakage went unnoticed.
    #
    # A preset cannot replace them here: `@deepseek-ai/dsh-tool-fs` still
    # registers read, write and edit from ONE package, so no row selection can
    # give a reviewer "read without write" — omitting the package removes reading
    # too, which makes the role useless.
    #
    # So reviewer read-only is INSTRUCTION-CARRIED today (`skills/party-review`,
    # `skills/aidlc` §5.3), not enforced by the tool registry. That is a real
    # regression from the earlier design, recorded rather than quietly dropped.
    # The mechanism that would restore it is a plugin-side `tools.restrict()` in
    # the child's creation window — RESTRICT is still available on the tool
    # service; only the declarative `toolFilter` field is gone.
    #
    # ── REMOVED (2026-10-20): the extra delegation row is gone ────────────────
    # This bundle used to insert a SECOND `@deepseek-ai/dsh-tool-subagent` row
    # here (`toolName: subagent_reviewer`). On v0.2.1 that is wrong twice over:
    #
    #   1. It mounted the delegation tool at the ROOT scope. In v0.2.1 the
    #      delegation tool is composed INSIDE an agent preset — the shipped
    #      `standard` preset already has its own `tool-subagent` and
    #      `tool-subagent-fork` rows — and it expects an agent-scoped owner. A
    #      root-scoped duplicate adds a delegate with no owning agent to resolve
    #      and interferes with the subagent tools the preset already provides,
    #      which matches the report that subagents stopped working.
    #   2. Even at its best it carried no `toolFilter`, so it bought nothing: its
    #      only purpose was the mechanical read-only guarantee, which v0.2.1
    #      removed. A row that provides no capability but can break delegation is
    #      not worth keeping.
    #
    # Reviewer roles now dispatch through the ordinary `subagent` tool the preset
    # provides. Read-only review is instruction-carried (see above), and the
    # orchestrator verifies the diff is unchanged after review.

# ── BEGIN generated: AIDLC mode preset (scripts/sync-preset.mjs) ──
#
# AIDLC mode: `standard` mode plus this plugin, declared the way v0.2.1 reads
# presets (a row with an explicit `plugins` list — the registry scans no
# directories). Deriving it from the installed `standard` declaration is what
# keeps the mode current across harness upgrades.
#
# Regenerate with: node scripts/sync-preset.mjs

- insert:
    - id: preset-aidlc
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: aidlc
        order: 5
        name: "AIDLC 模式"
        description: "标准模式的全部能力 + AI-DLC 生命周期：意图 → 设计门 → 构建 → 交付门 → 运维，工件链落 docs/aidlc/。决策模型先行判定，只在它拿不准时才打断你。 | Standard mode plus the AI-DLC lifecycle: intent → design gate → construction → delivery gate → operations, with an artifact chain under docs/aidlc/. The decision model is consulted first and only interrupts you when it is unsure."
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a coding agent powered by the {{model}} model.

                YOU ARE IN AI-DLC MODE. When the user describes something to build or change,
                begin it — load the `aidlc` skill and run its entry protocol, without waiting
                for a command. The decision model is consulted first at each decision point and
                a human only when it is unsure; the gates are the exception and stay human by
                default. Gates and guards are unchanged by the mode.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: time-context
            name: '@deepseek-ai/dsh-time-context'
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          - id: tool-schedule
            name: '@deepseek-ai/dsh-tool-schedule'
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                    You are in plan mode. Stay in plan mode until the user approves your plan through exit_plan_mode or switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                    Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan. Prefer existing functions and patterns over new machinery.

                    The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using mutation tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                    Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not ask the user where code lives or how current behavior works when you can find out.

                    Make the plan decision-complete: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes; cover edge cases, failure modes, tests, acceptance criteria, and explicit assumptions. Keep it concise enough to review but detailed enough that another engineer can implement it without making design decisions.

                    When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and implementation begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose or ask_user_question. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with implementation.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
          - id: tool-plugin-market
            name: '@deepseek-ai/dsh-plugin-market/tools'
            disabled: true
# ── END generated: AIDLC mode preset ──
